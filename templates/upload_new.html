<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HLA Decode</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #a8edea, #fed6e3);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 60px;
        }

        h2 {
            font-size: 3.5em;
            color: #1b5e20;
            margin-bottom: 10px;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        }

        h3 {
            font-size: 1.8em;
            color: #2e2e2e;
            margin-bottom: 40px;
            font-weight: 400;
        }

        form {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px 40px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }

        input[type="file"] {
            margin: 15px 0;
            cursor: pointer;
        }

        input[type="text"] {
            width: 90%;
            padding: 10px;
            margin: 15px 0;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 1em;
        }

        button {
            background: linear-gradient(90deg, #43e97b, #38f9d7);
            color: white;
            border: none;
            padding: 12px 30px;
            cursor: pointer;
            border-radius: 10px;
            font-size: 1em;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .file-list {
            margin: 20px 0;
            padding: 15px;
            border-radius: 15px;
            background: #f0f0f0;
            max-height: 200px;
            overflow-y: auto;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            margin: 5px 0;
            border-radius: 10px;
            background: #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .remove-btn {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
        }

        .remove-btn:hover {
            background-color: #e60000;
        }

        .file-info {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <h2>HLA Decode</h2>
    <h3>Upload CRAM/CRAI file for processing</h3>
   
    <form action="{{ url_for('upload') }}" method="post" enctype="multipart/form-data">
        <label for="fileInput">Select files:</label>
        <input type="file" id="fileInput" multiple>
        <div class="file-info">Click "Choose Files" to select multiple files at once, or add files one by one</div>
       
        <div id="fileList" class="file-list" style="display: none;">
            <strong>Selected Files:</strong>
            <div id="filesContainer"></div>
        </div>
       
        <label for="outputDir">Output Directory:</label>
        <input type="text" name="outputDir" id="outputDir" placeholder="/path/to/output" required>
       
        <button type="submit" id="submitBtn" disabled>Upload & Process Files</button>
    </form>

    <script>
        let selectedFiles = [];

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                if (!selectedFiles.some(f => f.name === file.name && f.size === file.size)) {
                    selectedFiles.push(file);
                }
            });
            updateFileList();
            e.target.value = '';
        });

        function updateFileList() {
            const fileListDiv = document.getElementById('fileList');
            const filesContainer = document.getElementById('filesContainer');
            const submitBtn = document.getElementById('submitBtn');

            if (selectedFiles.length > 0) {
                fileListDiv.style.display = 'block';
                filesContainer.innerHTML = '';
               
                selectedFiles.forEach((file, index) => {
                    const fileItem = document.createElement('div');
                    fileItem.className = 'file-item';
                    fileItem.innerHTML = `
                        <span>${file.name} (${formatFileSize(file.size)})</span>
                        <button type="button" class="remove-btn" onclick="removeFile(${index})">Remove</button>
                    `;
                    filesContainer.appendChild(fileItem);
                });

                submitBtn.disabled = false;
                document.querySelector('.file-info').innerHTML = `${selectedFiles.length} file(s) selected.`;
                document.querySelector('.file-info').style.color = '#28a745';
            } else {
                fileListDiv.style.display = 'none';
                submitBtn.disabled = true;
                document.querySelector('.file-info').innerHTML = 'Click "Choose Files" to select files.';
                document.querySelector('.file-info').style.color = '#666';
            }
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            updateFileList();
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        document.querySelector('form').addEventListener('submit', function(e) {
            if (selectedFiles.length === 0) {
                e.preventDefault();
                alert('Please select at least one file');
                return;
            }
            const dt = new DataTransfer();
            selectedFiles.forEach(file => dt.items.add(file));
           
            const hiddenInput = document.createElement('input');
            hiddenInput.type = 'file';
            hiddenInput.name = 'cramFiles';
            hiddenInput.files = dt.files;
            hiddenInput.style.display = 'none';
            hiddenInput.multiple = true;
            this.appendChild(hiddenInput);
        });
    </script>

</body>
</html>
